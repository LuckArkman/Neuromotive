behaviors:
  NeuromotiveAI:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.00025
      beta: 0.01
      epsilon: 0.15
      lambd: 0.92
      num_epoch: 4
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.1
        demo_path: demos/neuromotive_demo.demo
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 10000
